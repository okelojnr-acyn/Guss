[package]
name = "guss-nlu"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
guss-core = { version = "0.1.0", path = "../guss-core" }
guss-llm = { version = "0.1.0", path = "../guss-llm" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
