[package]
name = "guss-scheduler"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
guss-core = { version = "0.1.0", path = "../guss-core" }
guss-insights = { version = "0.1.0", path = "../guss-insights" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
guss-store = { path = "../guss-store" }
