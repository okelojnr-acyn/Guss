services:
  guss:
    build:
      context: .
      args:
        FEATURES: ${GUSS_FEATURES:-}
    env_file:
      - .env
    volumes:
      - guss-data:/app/data
    ports:
      - "8080:8080" # only needed for GUSS_CHANNEL__KIND=whatsapp's webhook
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
        required: false

  # Optional: free, local LLM. Only starts if you run
  # `docker compose --profile ollama up`. Point GUSS_LLM__BASE_URL at
  # http://ollama:11434/v1 in your .env to use it from inside the
  # guss container. Skip this service entirely if you're using Groq/OpenAI.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  # Optional Postgres backend. Only starts if you run
  # `docker compose --profile postgres up`. Build the guss image with
  # GUSS_FEATURES=postgres and point GUSS_STORE__URL at
  # postgres://guss:guss@postgres:5432/guss in your .env to use it - see
  # docs/ARCHITECTURE.md's Storage section. SQLite (no profile, no extra
  # build feature) remains the zero-config default.
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: guss
      POSTGRES_PASSWORD: guss
      POSTGRES_DB: guss
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  guss-data:
  ollama-data:
  postgres-data:
