[package]
name = "guss"
version = "0.1.0"
edition = "2024"

[features]
# Off by default at the workspace level since it requires a C/C++
# toolchain + CMake to build whisper.cpp. Build with --features
# local-whisper for offline/free speech-to-text - see
# docs/setup-elevenlabs-piper.md.
local-whisper = ["guss-voice/local-whisper"]
# Off by default - adds PostgresStore as a storage option (picked at
# runtime from GUSS_STORE__URL's scheme via guss_store::AnyStore). Plain
# SQLite needs no feature flag at all. See docs/ARCHITECTURE.md.
postgres = ["guss-store/postgres"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["env", "toml"] }
guss-channels = { version = "0.1.0", path = "../../crates/guss-channels" }
guss-core = { version = "0.1.0", path = "../../crates/guss-core" }
guss-llm = { version = "0.1.0", path = "../../crates/guss-llm" }
guss-nlu = { version = "0.1.0", path = "../../crates/guss-nlu" }
guss-scheduler = { version = "0.1.0", path = "../../crates/guss-scheduler" }
guss-store = { version = "0.1.0", path = "../../crates/guss-store" }
guss-voice = { version = "0.1.0", path = "../../crates/guss-voice", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["env", "toml", "test"] }
