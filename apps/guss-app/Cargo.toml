[package]
name = "guss"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["env", "toml"] }
guss-core = { version = "0.1.0", path = "../../crates/guss-core" }
guss-store = { version = "0.1.0", path = "../../crates/guss-store" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["env", "toml", "test"] }
